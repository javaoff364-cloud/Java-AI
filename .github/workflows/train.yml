name: Javus AI continuous training

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: javus-training
  cancel-in-progress: false

jobs:
  train:
    name: Test and continuously train Javus Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore previous training checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            checkpoints/javus-alpha.pt
            checkpoints/javus-small.pt
          key: javus-checkpoint-${{ github.run_id }}
          restore-keys: |
            javus-checkpoint-

      - name: Run core tests
        run: python -m pytest -q

      - name: Train continuously in 100-step batches
        timeout-minutes: 340
        run: |
          set -o pipefail
          python -m javus.train --steps 100 --batch-size 8 --forever 2>&1 | tee -a training.log

      - name: Save checkpoint for the next run
        if: always() && hashFiles('checkpoints/javus-alpha.pt') != ''
        uses: actions/cache/save@v4
        with:
          path: checkpoints/javus-alpha.pt
          key: javus-checkpoint-${{ github.run_id }}

      - name: Verify latest checkpoint
        if: always()
        run: |
          test -s checkpoints/javus-alpha.pt
          ls -lh checkpoints/javus-alpha.pt
          ls -lh checkpoints/javus-alpha-best.pt || true

      - name: Upload latest model checkpoint and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javus-alpha-smart-checkpoint
          path: |
            checkpoints/javus-alpha.pt
            checkpoints/javus-alpha-best.pt
            checkpoints/javus-alpha-metrics.jsonl
            training.log
          if-no-files-found: error
          retention-days: 14
