name: Javus Alpha 2 Bounded Training

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Maximum optimizer steps for this run (100–1000)"
        required: false
        default: "100"
        type: choice
        options:
          - "100"
          - "250"
          - "500"
          - "1000"

permissions:
  contents: read

concurrency:
  group: javus-alpha-2-training
  cancel-in-progress: false

jobs:
  train:
    name: Test and train Javus Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt

      - name: Restore previous training checkpoint and metrics
        uses: actions/cache/restore@v4
        with:
          path: |
            checkpoints/javus-alpha.pt
            checkpoints/javus-alpha-best.pt
            checkpoints/javus-alpha-metrics.jsonl
            checkpoints/javus-small.pt
            checkpoints/javus-alpha-pre-multilingual.pt
            checkpoints/javus-alpha-pre-alpha2.pt
          key: javus-alpha-checkpoint-${{ github.run_id }}
          restore-keys: |
            javus-alpha-checkpoint-
            javus-checkpoint-

      - name: Run tests before training
        run: python -m pytest -q

      - name: Run one bounded training session
        timeout-minutes: 45
        env:
          TRAIN_STEPS: ${{ inputs.steps || '100' }}
        run: |
          set -euo pipefail
          python -m javus.train --steps "$TRAIN_STEPS" --batch-size 8 2>&1 | tee training.log

      - name: Save checkpoint for the next run
        if: always() && hashFiles('checkpoints/javus-alpha.pt') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            checkpoints/javus-alpha.pt
            checkpoints/javus-alpha-best.pt
            checkpoints/javus-alpha-metrics.jsonl
            checkpoints/javus-small.pt
            checkpoints/javus-alpha-pre-multilingual.pt
          key: javus-alpha-checkpoint-${{ github.run_id }}

      - name: Upload Javus checkpoints, metrics and log
        if: always() && hashFiles('checkpoints/javus-alpha.pt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: javus-alpha-training-${{ github.run_number }}
          path: |
            checkpoints/javus-alpha.pt
            checkpoints/javus-alpha-best.pt
            checkpoints/javus-alpha-metrics.jsonl
            training.log
          if-no-files-found: warn
          retention-days: 30
