name: Javus AI training

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Trening qadamlari"
        required: true
        type: choice
        default: "100"
        options:
          - "50"
          - "100"
          - "200"
          - "500"

permissions:
  contents: read

concurrency:
  group: javus-training
  cancel-in-progress: false

jobs:
  train:
    name: Test and train Javus Small
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run core tests
        run: python -m pytest -q

      - name: Train Javus Small on CPU
        env:
          TRAIN_STEPS: ${{ inputs.steps }}
        run: |
          set -o pipefail
          echo "Training steps: ${TRAIN_STEPS}"
          python -m javus.train --steps "${TRAIN_STEPS}" --batch-size 8 2>&1 | tee training.log

      - name: Verify checkpoint
        run: |
          test -s checkpoints/javus-small.pt
          ls -lh checkpoints/javus-small.pt

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: javus-small-checkpoint
          path: |
            checkpoints/javus-small.pt
            training.log
          if-no-files-found: error
          retention-days: 14
