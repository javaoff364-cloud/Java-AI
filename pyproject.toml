[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "javus-ai"
version = "0.1.0"
description = "Javus AI neural network research project"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["torch>=2.2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.27.0", "pydantic>=2.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
